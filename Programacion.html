 .calenday {
  font-family: 'Segoe UI', sans-serif;
  color: #fff;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: row; /* en desktop lado a lado */
  min-height: 100vh;
}

/* Calendario */
.calendar {
  width: 40%;
  background: rgba(255,255,255,0.05);
  padding: 0;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 10px;
  border-right: 2px solid rgba(255,255,255,0.2);
}

.day {
  background: rgba(255,255,255,0.1);
  border-radius: 10px;
  text-align: center;
  padding: 15px;
  cursor: pointer;
  transition: background 0.3s ease, transform 0.3s ease;
}
.day:hover {
  background: rgba(255,255,255,0.2);
  transform: scale(1.05);
}

/* Card lateral */
.details {
  width: 50%;
  padding: 30px;
  display: none;
  flex-direction: column;
  justify-content: center;
  animation: slideIn 0.5s forwards;
}
@keyframes slideIn {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

h2 {
  color: #ffd700;
}
.invitados {
  list-style: none;
  padding: 0;
}
.invitados li {
  background: rgba(255,255,255,0.1);
  margin: 10px 0;
  padding: 10px;
  border-radius: 8px;
}
.guest-name {
  font-weight: bold;
  color: #ffd700;
}
.guest-role {
  font-style: italic;
  color: #ddd;
}

/* Video premium */
.video-card {
  margin-top: 20px;
  background: rgba(255,255,255,0.05);
  border-radius: 15px;
  padding: 15px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}
.video-card:hover {
  transform: scale(1.02);
  box-shadow: 0 12px 25px rgba(0,0,0,0.6);
}
.video-card iframe {
  width: 100%;
  height: 315px;
  border: none;
  border-radius: 10px;
}

/* 🔹 Adaptación móvil */
@media (max-width: 768px) {
  body {
    flex-direction: column; /* apilar calendario y detalles */
  }
  .calenday{
    flex-wrap: wrap;
  }
  .calendar {
    width: 100%;
    grid-template-columns: repeat(5, 1fr); /* menos columnas para móviles */
    border-right: none;
    border-bottom: 2px solid rgba(255,255,255,0.2);
  }
  .details {
    width: 100%;
    padding: 20px;
  }
  .video-card iframe {
    height: 200px; /* más compacto en móvil */
  }
}

    function showDetails(day) {
      const programa = programas[day];
      if (!programa) return;
      document.getElementById("fecha").innerText = programa.fecha;
      document.getElementById("titulo").innerText = programa.titulo;
      document.getElementById("hora").innerText = programa.hora;
      const invitadosList = document.getElementById("invitados");
      invitadosList.innerHTML = "";
      programa.invitados.forEach(inv => {
        const li = document.createElement("li");
        li.innerHTML = `<span class="guest-name">${inv.nombre}</span> — <span class="guest-role">${inv.rol}</span>`;
        invitadosList.appendChild(li);
      });
          document.getElementById("player").innerHTML = programa.video;
      document.getElementById("details").style.display = "flex";
