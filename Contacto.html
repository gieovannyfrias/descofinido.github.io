<body>
  <header>
    <h1>Contacto Paranormal</h1>
  </header>
  <main>
    <div class="contact-card">
      <h2>Envíanos un mensaje</h2>
      <h3 style="color: white">Envianos tu historia</h3>
<form  action="https://formspree.io/f/xjgqbkba" method="POST">
  <input type="text" name="nombre" placeholder="Tu nombre" required>
  <input type="email" name="email" placeholder="Tu correo" required>
  <input type="text" name="asunto" placeholder="Asunto" required>
  <textarea name="mensaje" rows="5" placeholder="Escribe tu historia que diga no mmes estas bien enfermo mental wey..." required></textarea>
        <input type="url" name="drive" placeholder="Link de Google Drive (Archivos adjuntados que sea publico)">
  
  <label for="telefono">Teléfono</label>
  <div class="telefono-group">
    <select name="prefijo" id="prefijo" required>
      <option value="">Selecciona país</option>
      <!-- América del Norte -->
      <option value="+1">Estados Unidos (+1)</option>
      <option value="+1">Canadá (+1)</option>
      <option value="+52">México (+52)</option>
      <!-- América Central -->
      <option value="+502">Guatemala (+502)</option>
      <option value="+503">El Salvador (+503)</option>
      <option value="+504">Honduras (+504)</option>
      <option value="+505">Nicaragua (+505)</option>
      <option value="+506">Costa Rica (+506)</option>
      <option value="+507">Panamá (+507)</option>
      <option value="+501">Belice (+501)</option>
      <!-- Caribe -->
      <option value="+53">Cuba (+53)</option>
      <option value="+1">República Dominicana (+1)</option>
      <option value="+1">Puerto Rico (+1)</option>
      <option value="+1">Jamaica (+1)</option>
      <option value="+1">Trinidad y Tobago (+1)</option>
      <option value="+1">Barbados (+1)</option>
      <option value="+1">Bahamas (+1)</option>
      <!-- América del Sur -->
      <option value="+54">Argentina (+54)</option>
      <option value="+55">Brasil (+55)</option>
      <option value="+56">Chile (+56)</option>
      <option value="+57">Colombia (+57)</option>
      <option value="+58">Venezuela (+58)</option>
      <option value="+51">Perú (+51)</option>
      <option value="+598">Uruguay (+598)</option>
      <option value="+595">Paraguay (+595)</option>
      <option value="+591">Bolivia (+591)</option>
      <option value="+593">Ecuador (+593)</option>
      <option value="+597">Surinam (+597)</option>
      <option value="+592">Guyana (+592)</option>
      <!-- Europa extra -->
      <option value="+33">Francia (+33)</option>
    </select>
    <input type="tel" name="telefono" placeholder="Tu número" required>
  </div>

  
  <select name="tipo">
    <option value="">Selecciona tipo de consulta</option>
    <option value="colaboracion">Colaboración</option>
    <option value="reporte">Reporte paranormal</option>
    <option value="prensa">Prensa</option>
    <option value="otro">Otro</option>
  </select>

  <button type="submit">Enviar</button>
</form>


    </div>
  </main>

  <style>
    :root {
      --bg-dark: #0d0d0d;
      --accent: #7f00ff;
      --accent-hover: #9c27b0;
      --text-light: #f5f5f5;
      --radius: 10px;
    }

    body {
      margin: 0;
      font-family: 'Inter', Arial, sans-serif;
  zoom:75%;
  background-image: url("https://lh3.googleusercontent.com/d/1hoPRdy_HC4jYsBehtxSonyrExPeZjrd-=w1000");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed; /* efecto de fondo fijo */
      color: var(--text-light);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      zoom:75%;
    }

    header {
      text-align: center;
      padding: 3rem 1rem;
      background: linear-gradient(135deg, #000, var(--accent));
    }

    header h1 {
      margin: 0;
      font-size: 2.5rem;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(127,0,255,0.7);
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .contact-card {
      background: rgba(20,20,20,0.95);
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: 0 0 25px rgba(127,0,255,0.4);
      max-width: 500px;
      width: 100%;
    }

    .contact-card h2 {
      margin-top: 0;
      font-size: 1.8rem;
      color: var(--accent);
      text-align: center;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input, textarea {
      padding: 0.8rem;
      border: none;
      border-radius: var(--radius);
      background: #1a1a1a;
      color: var(--text-light);
      font-size: 1rem;
      transition: box-shadow 0.3s ease;
    }

    input:focus, textarea:focus {
      outline: none;
      box-shadow: 0 0 10px var(--accent);
    }
select {
  padding: 0.9rem;
  border: none;
  border-radius: var(--radius);
  background: #1a1a1a;
  color: var(--text-light);
  font-size: 1rem;
  cursor: pointer;
  transition: box-shadow 0.3s ease, transform 0.2s ease;
  appearance: none; /* quita el estilo por defecto del navegador */
}

select:focus {
  outline: none;
  box-shadow: 0 0 10px var(--accent);
  transform: scale(1.02);
}

option {
  background: #1a1a1a;
  color: var(--text-light);
}

    button {
      background: var(--accent);
      color: var(--text-light);
      border: none;
      padding: 0.9rem;
      border-radius: var(--radius);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }


  </style>
  <script src="src/components/Header-Footer/header-footer-main.js" defer></script>
</body>
