<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=3.0, minimum-scale=1.0">
   <link rel="icon" href="https://descofinido.gieovannyfrias.com/Imagenes/Logo.webp" type="image/x-icon">
    <title>404</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0a0a0a;
            color: #00ff66; /* Verde terminal clásico, pero enfermo */
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
          zoom:75%;
        }

        /* Líneas de escaneo CRT antiguas */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        .container {
            text-align: center;
            max-width: 650px;
            padding: 30px;
            z-index: 1;
            position: relative;
        }

        /* Código de error gigante parpadeante */
        .error-code {
            font-size: 6rem;
            font-weight: bold;
            letter-spacing: 10px;
            color: #00ff66;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.7);
            animation: flicker 0.15s infinite;
        }

        h2 {
            font-size: 1.5rem;
            margin-top: 10px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.1rem;
            color: #88aa88;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        /* Texto de advertencia oculto/glitch */
        .warning-text {
            display: block;
            margin-top: 15px;
            color: #ff3333; /* Cambio brusco a rojo */
            text-shadow: 0 0 5px #ff0000;
            font-size: 0.95rem;
            animation: pulse 2s infinite;
        }

        /* Botón de escape */
        .btn-escape {
            display: inline-block;
            background-color: transparent;
            border: 1px solid #00ff66;
            color: #00ff66;
            padding: 12px 25px;
            text-decoration: none;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(0, 255, 102, 0.2);
        }

        .btn-escape:hover {
            background-color: #00ff66;
            color: #0a0a0a;
            box-shadow: 0 0 20px #00ff66;
            font-weight: bold;
        }

        /* Animación de parpadeo de pantalla rota */
        @keyframes flicker {
            0% { opacity: 0.95; transform: translateX(0); }
            10% { opacity: 0.5; transform: translateX(-2px); }
            11% { opacity: 0.95; transform: translateX(0); }
            70% { opacity: 0.9; filter: blur(0px); }
            71% { opacity: 0.2; filter: blur(1px); transform: translateY(1px); }
            72% { opacity: 0.95; filter: blur(0px); transform: translateY(0); }
            95% { opacity: 0.95; }
            96% { opacity: 0.3; }
            97% { opacity: 0.95; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-code">404</div>
        <h2>Directorio Inexistente</h2>
        <p>
            El recurso que buscas ha sido borrado, desplazado o nunca perteneció a esta realidad. 
            Has caminado demasiado lejos en los archivos muertos del servidor.
            <span class="warning-text">DA LA VUELTA. ESTRECHAR EL ABISMO SÓLO HACE QUE TE VEA.</span>
        </p>
        <a href="/" class="btn-escape">Regresar a la superficie</a>
    </div>

</body>
</html>
